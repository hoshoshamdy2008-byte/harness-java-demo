apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1  # Reduced from 3 to 1 to stay within regional disk quota
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - image: hoshoshamdy/tech-lab-repo:latest
        name: guestbook-ui
        ports:
        - containerPort: 80
        # ADD THIS SECTION:
        resources:
          requests:
            cpu: "250m"      # Minimal CPU to avoid triggering a new node
            memory: "512Mi"  # Minimal RAM suitable for a small Java app
          limits:
            cpu: "500m"
            memory: "1Gi"
